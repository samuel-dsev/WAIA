x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  INFRASTRUCTURE_MODE: postgres
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${DATABASE_APP_USER:-waia_app}:${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD obrigatorio}@postgres:5432/${POSTGRES_DB:-waia}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
  REDIS_URL: redis://redis:6379
  REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-waia-messages}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  TENANT_CONCURRENCY: ${TENANT_CONCURRENCY:-1}
  RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
  RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
  WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-10000}
  WORKER_HEARTBEAT_TTL_MS: ${WORKER_HEARTBEAT_TTL_MS:-30000}
  MEDIA_STORAGE_ROOT: /app/.data/media
  MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
  MASTER_KEYRING: ${MASTER_KEYRING:-}
  SESSION_PEPPER: ${SESSION_PEPPER:-}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-300}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v26.0}
  META_APP_SECRET: ${META_APP_SECRET:-}
  WHATSAPP_REQUEST_TIMEOUT_MS: ${WHATSAPP_REQUEST_TIMEOUT_MS:-15000}
  GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
  GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
  GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
  GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-.secrets/google-service-account.json}
  GOOGLE_SHEETS_SYNC_INTERVAL_MS: ${GOOGLE_SHEETS_SYNC_INTERVAL_MS:-120000}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      panel:
        condition: service_started
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      PANEL_DOMAIN: ${PANEL_DOMAIN:-painel.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - internal
    logging: *default-logging

  api:
    build: .
    restart: unless-stopped
    command: npm run start:api
    environment:
      <<: *runtime-environment
      API_PORT: 3001
      WEBHOOK_PORT: 3001
      COOKIE_SECURE: "true"
      PANEL_ORIGIN: https://${PANEL_DOMAIN:-painel.localhost}
    expose:
      - "3001"
    volumes:
      - media_data:/app/.data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - egress
    stop_grace_period: 45s
    logging: *default-logging

  worker:
    build: .
    restart: unless-stopped
    command: npm run start:worker
    environment:
      <<: *runtime-environment
      COOKIE_SECURE: "true"
      PANEL_ORIGIN: https://${PANEL_DOMAIN:-painel.localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/.data/media
    networks:
      - internal
      - egress
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "import('ioredis').then(async({default:R})=>{const r=new R(process.env.REDIS_URL,{maxRetriesPerRequest:1});const v=await r.get('waia:worker:heartbeat:'+process.env.HOSTNAME);await r.quit();process.exit(v?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-waia}
      POSTGRES_USER: ${POSTGRES_USER:-waia_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-waia_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD obrigatorio}
    volumes:
      - ./infra/postgres/init-app-role.sh:/usr/local/bin/init-app-role.sh:ro
    command: ["sh", "/usr/local/bin/init-app-role.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default-logging

  media-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /media && chmod 700 /media"]
    volumes:
      - media_data:/media
    networks:
      - internal
    logging: *default-logging

  migrate:
    build: .
    restart: "no"
    command: npm run db:migrate
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://${POSTGRES_USER:-waia_owner}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/${POSTGRES_DB:-waia}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - internal
    logging: *default-logging

  panel:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./panel:/usr/share/nginx/html:ro
      - ./infra/panel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      - internal
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waia}
      POSTGRES_USER: ${POSTGRES_USER:-waia_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  media_data:

networks:
  public:
  internal:
    internal: true
  egress:
